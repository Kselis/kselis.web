<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Kselis</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <style>
        :root {
            --bg: #fafafa;
            --card-bg: #ffffff;
            --text: #111;
            --text-muted: #666;
            --border: #ddd;
            --accent: #000;
            --error: #d32f2f;
            --success: #2e7d32;
            --font-heading: 'Playfair Display', serif;
            --font-body: 'Raleway', sans-serif;
        }
        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-image: radial-gradient(rgba(0,0,0,0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* --- DARK THEME OVERRIDES --- */
        body.dark-theme {
            --bg: #121212;
            --text: #f0f0f0;
            --card-bg: #1e1e1e; /* Perfect for Profile/Contact cards */
            --border: #333;
            --hover-bg: #2a2a2a;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        }

        /* Smooth transition for the color swap */
        body {
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .card, .contact-form-side, .info-card {
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .auth-card {
            background: var(--card-bg);
            padding: 50px 40px;
            border-radius: 8px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 20px rgba(0,0,0,0.03);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        h1 {
            font-family: var(--font-heading);
            margin: 0 0 10px 0;
            font-size: 2.5rem;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 30px;
            font-size: 0.95rem;
            word-break: break-all;
        }
        .input-group {
            margin-bottom: 16px;
            text-align: left;
            position: relative;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: var(--font-body);
            font-size: 0.95rem;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-group input:focus {
            border-color: var(--accent);
        }
        .input-group input.input-error {
            border-color: var(--error);
        }
        
        .password-wrapper {
            position: relative;
            margin-bottom: 12px;
        }
        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #888;
            font-size: 20px;
            user-select: none;
        }
        .toggle-password:hover { color: var(--accent); }
        
        .password-guide {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 6px;
            margin-bottom: 16px;
            text-align: left;
        }

        .error-msg {
            color: var(--error);
            font-size: 0.8rem;
            font-weight: 600;
            margin-top: 6px;
            display: none;
            text-align: left;
        }
        
        .primary-btn {
            width: 100%;
            padding: 12px;
            background-color: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
            border-radius: 4px;
            font-family: var(--font-body);
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 10px;
        }
        .primary-btn:hover { opacity: 0.85; }
        .primary-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        #successMessage {
            display: none;
            color: var(--success);
            font-weight: 600;
            margin-bottom: 20px;
        }
        
        #backToLogin {
            display: none;
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            margin-top: 20px;
        }
        #backToLogin:hover {
            text-decoration: underline;
        }

        /* Loading state for the form itself */
        #resetForm {
            display: none; /* Hidden until token is verified */
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1 id="pageTitle">New Password</h1>
        <p id="pageSubtitle">Verifying your secure link...</p>

        <div id="successMessage">Your password has been successfully reset!</div>

        <div id="resetForm">
            <div class="input-group">
                <div class="password-wrapper">
                    <input type="password" id="newPassword" placeholder="New Password" autocomplete="new-password" required>
                    <span class="material-symbols-outlined toggle-password" id="togglePassword">visibility_off</span>
                </div>
                
                <div class="password-wrapper">
                    <input type="password" id="confirmPassword" placeholder="Confirm New Password" autocomplete="new-password" required>
                </div>

                <div class="password-guide" id="passwordGuide">Must be at least 8 characters, and include a number, a letter, and a symbol.</div>
                <div class="error-msg" id="passwordError"></div>
            </div>
            
            <button id="savePasswordBtn" class="primary-btn">Save Password</button>
        </div>

        <a href="login.html" id="backToLogin">← Back to Sign In</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // REPLACE WITH YOUR ACTUAL CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyBoa4FqirqTzEDGW7zuLPfUjZT6pV1T6yw",
            authDomain: "kselis.firebaseapp.com",
            projectId: "kselis",
            storageBucket: "kselis.firebasestorage.app",
            messagingSenderId: "480272527158",
            appId: "1:480272527158:web:19694da8df9dfe9c9f8d97",
            measurementId: "G-F03VP7SM3Z"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Get the Secret Token (oobCode) from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');
        const mode = urlParams.get('mode');

        // DOM Elements
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const togglePassword = document.getElementById('togglePassword');
        const savePasswordBtn = document.getElementById('savePasswordBtn');
        const passwordError = document.getElementById('passwordError');
        const resetForm = document.getElementById('resetForm');
        const successMessage = document.getElementById('successMessage');
        const backToLogin = document.getElementById('backToLogin');
        const pageSubtitle = document.getElementById('pageSubtitle');

        let submitting = false;

        // Toggle visibility for both password fields
        togglePassword.addEventListener('click', () => {
            const isPassword = newPasswordInput.getAttribute('type') === 'password';
            const newType = isPassword ? 'text' : 'password';
            
            newPasswordInput.setAttribute('type', newType);
            confirmPasswordInput.setAttribute('type', newType);
            togglePassword.textContent = isPassword ? 'visibility' : 'visibility_off';
        });

        // Helper: Show error
        const showError = (inputEl1, inputEl2, message) => {
            passwordError.textContent = message;
            passwordError.style.display = 'block';
            if (inputEl1) inputEl1.classList.add('input-error');
            if (inputEl2) inputEl2.classList.add('input-error');
        };

        // Helper: Clear errors
        const clearErrors = () => {
            passwordError.style.display = 'none';
            newPasswordInput.classList.remove('input-error');
            confirmPasswordInput.classList.remove('input-error');
        };

        // Initialize: Verify the code up front
        if (!actionCode || mode !== 'resetPassword') {
            pageSubtitle.textContent = "Invalid or missing reset link. Please request a new one from the login page.";
            pageSubtitle.style.color = "var(--error)";
            backToLogin.style.display = 'inline-block';
        } else {
            verifyPasswordResetCode(auth, actionCode)
                .then((email) => {
                    // Code is valid. Show the form and confirm the email.
                    pageSubtitle.textContent = `Resetting password for ${email}`;
                    resetForm.style.display = 'block';
                })
                .catch((error) => {
                    // Code is expired or invalid
                    pageSubtitle.textContent = "This reset link is invalid or has expired. Please request a new one.";
                    pageSubtitle.style.color = "var(--error)";
                    backToLogin.style.display = 'inline-block';
                });
        }

        // Handle Save
        savePasswordBtn.addEventListener('click', async () => {
            if (submitting) return;
            clearErrors();
            
            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!newPassword || !confirmPassword) {
                showError(newPasswordInput, confirmPasswordInput, "Please fill out both password fields.");
                return;
            }

            if (newPassword !== confirmPassword) {
                showError(newPasswordInput, confirmPasswordInput, "Passwords do not match.");
                return;
            }

            // Custom Regex Validation
            const pwRegex = /^(?=.*[A-Za-z])(?=.*\d)(?=.*[\W_])[A-Za-z\d\W_]{8,}$/;
            if (!pwRegex.test(newPassword)) {
                showError(newPasswordInput, confirmPasswordInput, "Password does not meet the requirements.");
                return;
            }

            submitting = true;
            savePasswordBtn.disabled = true;
            savePasswordBtn.textContent = "Saving...";

            try {
                await confirmPasswordReset(auth, actionCode, newPassword);
                
                // UI Updates on Success
                resetForm.style.display = 'none';
                pageSubtitle.style.display = 'none';
                successMessage.style.display = 'block';
                backToLogin.style.display = 'inline-block';

            } catch (error) {
                if (error.code === 'auth/invalid-action-code' || error.code === 'auth/expired-action-code') {
                    showError(null, null, "This link has expired or already been used. Please request a new one.");
                } else if (error.code === 'auth/weak-password') {
                    showError(newPasswordInput, confirmPasswordInput, "Please choose a stronger password.");
                } else {
                    showError(null, null, "Something went wrong resetting your password. Please try again.");
                }
            } finally {
                submitting = false;
                savePasswordBtn.disabled = false;
                savePasswordBtn.textContent = "Save Password";
            }
        });
        document.addEventListener('DOMContentLoaded', () => {
            // Grab both potential buttons (they might be null depending on the page)
            const footerToggle = document.getElementById('themeToggleFooter');
            const profileToggle = document.getElementById('themeToggleProfile');
            
            // Elements to update text/icons
            const iconFooter = document.getElementById('themeIconFooter');
            const textFooter = document.getElementById('themeTextFooter');
            const iconProfile = document.getElementById('themeIconProfile');
            const textProfile = document.getElementById('themeTextProfile');

            // Function to apply the UI updates based on current mode
            function applyThemeUI(isDark) {
                if (isDark) {
                    document.body.classList.add('dark-theme');
                    if (footerToggle) {
                        iconFooter.textContent = 'light_mode';
                        textFooter.textContent = 'Light Mode';
                    }
                    if (profileToggle) {
                        iconProfile.textContent = 'light_mode';
                        textProfile.textContent = 'Light Mode';
                    }
                } else {
                    document.body.classList.remove('dark-theme');
                    if (footerToggle) {
                        iconFooter.textContent = 'dark_mode';
                        textFooter.textContent = 'Dark Mode';
                    }
                    if (profileToggle) {
                        iconProfile.textContent = 'dark_mode';
                        textProfile.textContent = 'Dark Mode';
                    }
                }
            }

            // 1. Check LocalStorage on page load
            const currentTheme = localStorage.getItem('kselis_theme');
            if (currentTheme === 'dark') {
                applyThemeUI(true);
            }

            // 2. Click Handler Function
            function handleThemeToggle() {
                const willBeDark = !document.body.classList.contains('dark-theme');
                localStorage.setItem('kselis_theme', willBeDark ? 'dark' : 'light');
                applyThemeUI(willBeDark);
            }

            // 3. Attach click listeners to whichever buttons exist on this specific page
            if (footerToggle) footerToggle.addEventListener('click', handleThemeToggle);
            if (profileToggle) profileToggle.addEventListener('click', handleThemeToggle);
        });
    </script>
</body>
</html>
