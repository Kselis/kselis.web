query ReadOperations @auth(level: USER) {
  course(key: { id: "00000000-0000-0000-0000-000000000000" }) { title }
  courses { title }
  courseSkill(key: { courseId: "00000000-0000-0000-0000-000000000000", skillId: "11111111-1111-1111-1111-111111111111" }) { course { title } }
  courseSkills { courseId }
  department(key: { id: "22222222-2222-2222-2222-222222222222" }) { name }
  departments { name }
  employee(key: { id: "33333333-3333-3333-3333-333333333333" }) { name }
  employees { name }
  employeeSkill(key: { employeeId: "33333333-3333-3333-3333-333333333333", skillId: "11111111-1111-1111-1111-111111111111" }) { employee { name } }
  employeeSkills { employeeId }
  enrollment(key: { id: "44444444-4444-4444-4444-444444444444" }) { status }
  enrollments { status }
  skill(key: { id: "11111111-1111-1111-1111-111111111111" }) { name }
  skills { name }
}